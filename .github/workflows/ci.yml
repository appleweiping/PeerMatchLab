name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked bandit -q -c pyproject.toml -r src
      - run: uv audit --locked
      - run: uv run --locked pytest --cov=peermatchlab --cov-report=term-missing
      - run: uv run --locked python scripts/check_branch_coverage.py
      - run: >-
          uv run --locked peermatch expertise --snapshot examples/expertise/snapshot
          --config examples/expertise/config.json --reviewer-capacity 3
          --directory expertise-smoke
      - run: >-
          uv run --locked peermatch match-affinity
          --documents expertise-smoke/documents.json --experts expertise-smoke/experts.json
          --affinities expertise-smoke/affinities.csv
          --config examples/expertise/match-config.json --output expertise-plan-smoke.json
      - run: >-
          uv run --locked peermatch extract-keyphrases
          --documents examples/documents.json --experts examples/experts.json
          --directory keyphrases-smoke
      - run: >-
          uv run --locked peermatch extract-keyphrases
          --documents examples/centroid/documents.json --experts examples/centroid/experts.json
          --directory centroid-keyphrases-smoke
      - run: >-
          uv run --locked peermatch expertise-centroid
          --keyphrases centroid-keyphrases-smoke
          --documents examples/centroid/documents.json --experts examples/centroid/experts.json
          --train examples/centroid/train.jsonl --validation examples/centroid/validation.jsonl
          --dimensions 2 --epochs 3 --directory centroid-run-smoke
      - run: >-
          uv run --locked peermatch match-affinity
          --documents centroid-run-smoke/documents.json --experts centroid-run-smoke/experts.json
          --conflicts centroid-run-smoke/conflicts.json
          --affinities centroid-run-smoke/affinities.csv
          --config examples/expertise/match-config.json --output centroid-plan-smoke.json
      - run: >-
          uv run --locked peermatch expertise-embedding
          --snapshot examples/expertise/snapshot
          --embeddings examples/expertise/embeddings
          --directory embedding-smoke
      - run: >-
          uv run --locked peermatch match-affinity
          --documents embedding-smoke/documents.json --experts embedding-smoke/experts.json
          --affinities embedding-smoke/affinities.csv
          --config examples/expertise/match-config.json --output embedding-plan-smoke.json
      - run: >-
          uv run --locked peermatch match-affinity --documents examples/documents.json
          --experts examples/experts.json --conflicts examples/conflicts.json
          --affinities examples/affinities.csv --config examples/config.json
          --output affinity-smoke.json
      - run: >-
          uv run --locked peermatch match-affinity --documents examples/documents.json
          --experts examples/experts.json --conflicts examples/conflicts.json
          --affinities examples/affinities.csv --config examples/maximin-config.json
          --output maximin-smoke.json
      - run: >-
          uv run --locked peermatch match-affinity --documents examples/documents.json
          --experts examples/experts.json --conflicts examples/conflicts.json
          --affinities examples/affinities.csv --config examples/fair-local-config.json
          --output fair-local-smoke.json
      - run: >-
          uv run --locked peermatch what-if --documents examples/documents.json
          --experts examples/experts.json --conflicts examples/conflicts.json
          --config examples/config.json --scenarios examples/what-if-scenarios.json
          --output what-if-smoke.json
      - run: uv run --locked python -m build --no-isolation
      - name: Verify the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .ci-wheel-check
          .ci-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .ci-wheel-check/bin/python -c "import peermatchlab; print(peermatchlab.__version__)"
          .ci-wheel-check/bin/python -c "from peermatchlab.keyphrases import KeyphraseConfig, rank_keyphrases; assert rank_keyphrases('alpha beta', config=KeyphraseConfig())"
          .ci-wheel-check/bin/python -c "from peermatchlab import CentroidConfig, train_keyphrase_centroid; assert CentroidConfig and train_keyphrase_centroid"
          .ci-wheel-check/bin/python -c "from peermatchlab.what_if import WhatIfPlan, compare_what_if; assert WhatIfPlan and compare_what_if"
          .ci-wheel-check/bin/peermatch --help

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest
