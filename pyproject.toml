[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "peermatchlab"
version = "0.17.0"
description = "Transparent, constraint-aware expert matching for offline workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Weiping Yan" }]
keywords = ["matching", "recommendation", "assignment", "expertise", "information-retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "hatchling>=1.27",
]

[project.scripts]
peermatch = "peermatchlab.cli:main"

[project.urls]
Homepage = "https://github.com/appleweiping/PeerMatchLab"
Issues = "https://github.com/appleweiping/PeerMatchLab/issues"

[tool.hatch.build]
exclude = ["/.agent", "/target"]

[tool.hatch.build.targets.wheel]
packages = ["src/peermatchlab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["peermatchlab"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/peermatchlab/report.py" = ["E501"] # Embedded CSS remains readable as complete rules.

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["peermatchlab"]

[tool.bandit]
targets = ["src"]
